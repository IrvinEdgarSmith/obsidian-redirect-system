services:
  obsidian-redirect:
    build: .
    image: obsidian-redirect:latest
    container_name: obsidian-redirect
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config:/etc/obsidian-redirect/config:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - redirect-net

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: obsidian-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      obsidian-redirect:
        condition: service_healthy
    networks:
      - redirect-net

networks:
  redirect-net:
    driver: bridge
