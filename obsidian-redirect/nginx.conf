server {
    listen 80;
    root /usr/share/nginx/html-live;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
        default_type "text/html; charset=utf-8";
    }

    # Health check endpoint (used by cloudflared and monitoring)
    location = /health {
        access_log off;
        return 200 'ok';
        default_type text/plain;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
